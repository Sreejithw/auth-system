name: CI/CD

# CI runs on every push and pull request. Build + push + deploy only run on
# pushes to the long-lived branches:
#   develop -> staging     (image tags: <sha>, staging)
#   main    -> production  (image tags: <sha>, production, latest)
on:
  push:
    branches: ["**"]
  pull_request:

# Least-privilege by default; individual jobs elevate only what they need.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes / PR updates).
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires a lowercase owner/name.
  BACKEND_IMAGE: ghcr.io/sreejithw/auth-system-backend
  FRONTEND_IMAGE: ghcr.io/sreejithw/auth-system-frontend
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------------------
  # CI: backend
  # ---------------------------------------------------------------------------
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (only if a test script exists)
        # There are currently NO automated tests. This guard keeps the pipeline
        # green until a `test` script is added to backend/package.json.
        # TODO: add tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No backend test script found — skipping. # TODO: add tests"
          fi

      - name: Dependency audit (production deps, HIGH/CRITICAL only)
        # Blocks on HIGH/CRITICAL in production dependencies; low/moderate do not
        # fail the build.
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # CI: frontend
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (tsc -b + vite build — also validates types)
        run: npm run build

      - name: Test (only if a test script exists)
        # TODO: add tests
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No frontend test script found — skipping. # TODO: add tests"
          fi

      - name: Dependency audit (production deps, HIGH/CRITICAL only)
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # Security: secret scanning
  # ---------------------------------------------------------------------------
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just HEAD.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build + push: backend  (push to develop/main only, after CI passes)
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build & push backend
    needs: [backend, frontend, gitleaks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tags=${BACKEND_IMAGE}:${SHA},${BACKEND_IMAGE}:production,${BACKEND_IMAGE}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${BACKEND_IMAGE}:${SHA},${BACKEND_IMAGE}:staging" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_ref=${BACKEND_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      # Build once, load into the local Docker daemon (single-platform amd64 so
      # `load: true` is supported). We SCAN this local image BEFORE pushing, so a
      # vulnerable image never reaches the registry.
      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Trivy scan (fail on HIGH/CRITICAL)
        # Pinned to an immutable commit SHA (known-safe, v0.35.0) rather than a
        # tag: trivy-action's tags were force-pushed in the Mar 2026 supply-chain
        # compromise, so tags are not trustworthy. Bump deliberately after review.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.meta.outputs.scan_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Scan passed — push. Reuses the buildx cache, so this is fast (no rebuild).
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend

  # ---------------------------------------------------------------------------
  # Build + push: frontend  (push to develop/main only, after CI passes)
  # ---------------------------------------------------------------------------
  build-frontend:
    name: Build & push frontend
    needs: [backend, frontend, gitleaks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and API URL
        id: meta
        run: |
          SHA="${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "tags=${FRONTEND_IMAGE}:${SHA},${FRONTEND_IMAGE}:production,${FRONTEND_IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "api_url=${{ vars.VITE_API_URL_PRODUCTION }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${FRONTEND_IMAGE}:${SHA},${FRONTEND_IMAGE}:staging" >> "$GITHUB_OUTPUT"
            echo "api_url=${{ vars.VITE_API_URL_STAGING }}" >> "$GITHUB_OUTPUT"
          fi
          echo "scan_ref=${FRONTEND_IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"

      # VITE_API_URL is baked into the static bundle at BUILD time (Vite inlines
      # it), so it must be provided here as a build-arg per environment.
      - name: Build image (load locally, do not push yet)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_URL=${{ steps.meta.outputs.api_url }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy scan (fail on HIGH/CRITICAL)
        # Pinned to an immutable commit SHA (known-safe, v0.35.0) rather than a
        # tag: trivy-action's tags were force-pushed in the Mar 2026 supply-chain
        # compromise, so tags are not trustworthy. Bump deliberately after review.
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.meta.outputs.scan_ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_URL=${{ steps.meta.outputs.api_url }}
          cache-from: type=gha,scope=frontend

  # ---------------------------------------------------------------------------
  # Deploy: trigger Coolify (env-gated). Coolify pulls the new image and the
  # backend self-migrates on boot, so no migrations run here.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (Coolify webhook)
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GitHub Environments gate the deploy: `production` can require approvals.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - name: Trigger Coolify deploy webhook
        env:
          STAGING_WEBHOOK: ${{ secrets.COOLIFY_STAGING_WEBHOOK }}
          PRODUCTION_WEBHOOK: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            WEBHOOK="${PRODUCTION_WEBHOOK}"
          else
            WEBHOOK="${STAGING_WEBHOOK}"
          fi
          if [ -z "${WEBHOOK}" ]; then
            echo "::error::Deploy webhook secret is not set for this environment."
            exit 1
          fi
          # Coolify deploy webhooks are triggered with the API token as a Bearer.
          curl --fail-with-body --silent --show-error \
            -X GET "${WEBHOOK}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
