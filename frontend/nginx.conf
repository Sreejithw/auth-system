# nginx server config for the built Vite SPA.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compress text-like responses on the fly.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # Generated at container startup. Never cache it: deployments may promote the
  # same image digest while supplying a different API URL per environment.
  location = /config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # Vite emits content-hashed filenames under /assets, so they are safe to
  # cache aggressively and immutably.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: any unmatched path returns index.html so client-side routing
  # (react-router) handles deep links. index.html itself must never be cached,
  # otherwise clients pin a stale bundle reference.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
